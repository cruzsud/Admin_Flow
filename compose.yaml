services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: adminflow_budget
      POSTGRES_USER: adminflow
      POSTGRES_PASSWORD: ${ADMINFLOW_POSTGRES_PASSWORD:?Set ADMINFLOW_POSTGRES_PASSWORD in your local .env file}
    ports:
      - "${ADMINFLOW_POSTGRES_PORT:-15432}:5432"
    volumes:
      - adminflow_budget_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminflow -d adminflow_budget"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: adminflow
      RABBITMQ_DEFAULT_PASS: ${ADMINFLOW_RABBITMQ_PASSWORD:-}
    ports:
      - "${ADMINFLOW_RABBITMQ_PORT:-5672}:5672"
      - "${ADMINFLOW_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  adminflow_budget_postgres_data:
